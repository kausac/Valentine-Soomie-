
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 For Sooomie 💖</title>
<style>
/* ===== Body & Background ===== */
body {
  margin:0;
  padding:0;
  font-family: 'Comic Sans MS', cursive, sans-serif;
  background: linear-gradient(135deg, #ffe3f1 0%, #fff0e6 100%);
  overflow: hidden;
  text-align: center;
  cursor: none;
  color: #ff1144;
}

/* ===== Header ===== */
h1 {
  margin-top: 50px;
  font-size: 6vw;
  color: #ff3366;
  text-shadow: 2px 2px 5px #ffaacc;
  animation: pop 0.6s ease-in-out;
}

@keyframes pop {
  0% {transform: scale(0);}
  100% {transform: scale(1);}
}

/* ===== Buttons ===== */
#buttons {
  margin-top: 5vh;
}

button {
  background: #ff5bb5;
  border: none;
  padding: 2vh 6vw;
  border-radius: 50px;
  color: white;
  font-size: 4vw;
  cursor: pointer;
  margin: 2vw;
  transition: 0.3s ease;
  position: relative;
  box-shadow: 0 8px 15px rgba(255,0,100,0.3);
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 12px 20px rgba(255,0,100,0.5);
}

/* ===== Love Meter ===== */
#loveMeter {
  font-size: 10vw;
  margin-top: 3vh;
}

/* ===== Notes ===== */
.note {
  display: none;
  font-size: 4vw;
  margin-top: 2vh;
  color: #d12a6a;
  text-shadow: 1px 1px 2px #fff0ff;
}

/* ===== Typing Text ===== */
#typingText {
  margin-top: 4vh;
  font-size: 5vw;
  min-height: 7vh;
  color: #ff3366;
  text-shadow: 1px 1px 2px #fff0ff;
}

/* ===== Hearts & Confetti ===== */
.heart {
  position: absolute;
  font-size: 5vw;
  animation: float 6s ease-in-out infinite;
  color: #ff5577;
}

@keyframes float {
  0%,100% { transform: translateY(0);}
  50% { transform: translateY(-5vh);}
}

.confetti-piece {
  position: absolute;
  width: 3vw;
  height: 3vw;
  opacity: 0.8;
  animation: fall 5s linear infinite;
}

@keyframes fall {
  0% { transform: translateY(-100px) rotate(0deg);}
  100% { transform: translateY(100vh) rotate(360deg);}
}

/* ===== Cursor Hearts ===== */
.cursorHeart {
  position: absolute;
  pointer-events: none;
  font-size: 5vw;
  opacity: 0.9;
  transform: translate(-50%, -50%);
  animation: floatCursor 1s linear forwards;
}

@keyframes floatCursor {
  0% {opacity:1; transform:translate(-50%, -50%) scale(1);}
  100% {opacity:0; transform:translate(-50%, -150%) scale(1.5);}
}

/* ===== Popup ===== */
#popupMessage {
  display: none;
  position: fixed;
  top:0; left:0; width:100%; height:100%;
  background: rgba(255,200,230,0.95);
  z-index: 9999;
  text-align:center;
  font-size: 8vw;
  color:#ff1144;
  padding-top: 35vh;
  text-shadow: 2px 2px 5px #ffaacc;
}
</style>
</head>
<body>

<h1>Happy Valentine’s Day ❤️</h1>
<div id="typingText"></div>
<div id="loveMeter">💗💗💗💗💗</div>

<div id="buttons">
  <button id="yesBtn" onclick="fillLove(); showPopup()">Yes 😍</button>
  <button id="noBtn">No 😅</button>
</div>

<div class="note" id="note1">Sooomie, your smile brightens my day! 😊</div>
<div class="note" id="note2">Sooomie, your laugh is my favorite sound 🎶</div>
<div class="note" id="note3">Sooomie, you’re my today & all tomorrows ✨</div>

<div id="popupMessage">💖 Thank You, Sooomie! You’re My Forever 💖</div>

<script>
// ===== Floating hearts =====
const heartCount = 15;
for(let i=0; i<heartCount; i++){
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerText = "💓";
  heart.style.left = Math.random()*100 + "%";
  heart.style.animationDelay = Math.random()*4 + "s";
  document.body.appendChild(heart);
}

// ===== Confetti =====
const colors = ["#ff79c6", "#ff5bb5", "#ffddf4", "#fe7f9c"];
for(let i=0; i<50; i++){
  const c = document.createElement("div");
  c.classList.add("confetti-piece");
  c.style.background = colors[Math.floor(Math.random()*colors.length)];
  c.style.left = Math.random()*100 + "vw";
  c.style.animationDuration = Math.random()*4 + 3 + "s";
  document.body.appendChild(c);
}

// ===== Love meter =====
let loveCount = 5;
function fillLove(){
  if(loveCount < 10) loveCount++;
  document.getElementById("loveMeter").innerText = "💗".repeat(loveCount);
  const notes = ["note1","note2","note3"];
  const random = notes[Math.floor(Math.random()*notes.length)];
  document.getElementById(random).style.display = "block";
}

// ===== Typing effect =====
const text = "Sooomie, will you be my Valentine? ❤️";
let index = 0;
function typeWriter() {
  if(index < text.length){
    document.getElementById("typingText").innerHTML += text.charAt(index);
    index++;
    setTimeout(typeWriter, 100);
  }
}
window.onload = typeWriter;

// ===== Runaway No button =====
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseenter", () => {
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100) + 50;
  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  const yesBtn = document.getElementById("yesBtn");
  let currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
  yesBtn.style.fontSize = (currentSize + 1.5) + "px";
});

// ===== Cursor-follow hearts =====
document.addEventListener("mousemove", function(e){
  const heart = document.createElement("div");
  heart.className = "cursorHeart";
  heart.style.left = e.pageX + "px";
  heart.style.top = e.pageY + "px";
  heart.innerText = "💖";
  document.body.appendChild(heart);
  setTimeout(()=>{heart.remove()}, 1000);
});

// ===== Popup animation =====
function showPopup(){
  const popup = document.getElementById("popupMessage");
  popup.style.display = "block";

  for(let i=0;i<50;i++){
    const h = document.createElement("div");
    h.className="cursorHeart";
    h.style.fontSize = (Math.random()*15+10)+"vw";
    h.style.left = Math.random()*window.innerWidth + "px";
    h.style.top = Math.random()*window.innerHeight + "px";
    h.innerText = "💖";
    document.body.appendChild(h);
    setTimeout(()=>{h.remove()},2000);
  }

  setTimeout(()=>{popup.innerText="💞 I Love You, Sooomie! 💞"},1500);
}
</script>

</body>
</html>
