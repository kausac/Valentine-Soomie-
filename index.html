<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 For Sooomie 💖</title>

<style>
body{
  margin:0;
  padding:0;
  font-family:'Comic Sans MS', cursive;
  background: linear-gradient(135deg,#ffe3f1,#fff0e6);
  overflow:hidden;
  text-align:center;
  color:#ff2e63;
}

h1{
  margin-top:50px;
  font-size:6vw;
  text-shadow:2px 2px 8px #ffcce6;
}

#typingText{
  font-size:5vw;
  margin-top:20px;
  min-height:50px;
}

#loveMeter{
  font-size:10vw;
  margin:20px;
}

button{
  background:#ff5bb5;
  border:none;
  padding:15px 30px;
  border-radius:50px;
  color:white;
  font-size:4vw;
  margin:10px;
  box-shadow:0 8px 15px rgba(255,0,100,0.3);
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
}

.heart{
  position:absolute;
  font-size:5vw;
  animation:float 6s infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-30px)}
}

/* ===== POPUP ===== */

#popupMessage{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(255,192,203,0.95);
  z-index:9999;
  padding:40px 20px;
  overflow:auto;
  animation:fadeIn 1s ease forwards;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.popupContent{
  margin-top:10vh;
  animation:popUp 0.8s ease;
}

@keyframes popUp{
  from{transform:scale(0.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

.popupContent h2{
  font-size:8vw;
}

.popupNote{
  font-size:5vw;
  margin:20px 0;
  color:#c9184a;
}

.popupGif{
  width:80%;
  max-width:350px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<h1>Happy Valentine’s Day ❤️</h1>
<div id="typingText"></div>
<div id="loveMeter">💗💗💗💗💗</div>

<button onclick="showPopup()">Yes 😍</button>
<button id="noBtn">No 😅</button>

<div id="popupMessage">
  <div class="popupContent">
    <h2>💞 I Love You, Sooomie! 💞</h2>

    <div class="popupNote">
      Every moment with you feels like my favorite song playing on repeat.  
      You are my comfort, my happiness, my forever person.  
      I choose you today, tomorrow, and every heartbeat after that. 💖
    </div>

    <img class="popupGif" 
    src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

    <div class="popupNote">
      Forever yours,  
      ❤️ Your Love
    </div>
  </div>
</div>

<script>
const text="Sooomie, will you be my Valentine? ❤️";
let i=0;
function typeWriter(){
  if(i<text.length){
    document.getElementById("typingText").innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeWriter,80);
  }
}
window.onload=typeWriter;

// Runaway No button
const noBtn=document.getElementById("noBtn");
noBtn.addEventListener("mouseenter",()=>{
  const x=Math.random()*(window.innerWidth-noBtn.offsetWidth);
  const y=Math.random()*(window.innerHeight-noBtn.offsetHeight);
  noBtn.style.position="absolute";
  noBtn.style.left=x+"px";
  noBtn.style.top=y+"px";
});

function showPopup(){
  document.getElementById("popupMessage").style.display="block";
}
</script>

</body>
</html>
